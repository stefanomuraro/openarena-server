---
name: Build and Push to DockerHub

on:
  push:
    branches: [main]
    paths-ignore:
      # These don't affect the image or the linters, so skip the workflow.
      - "**/*.md"
      - ".editorconfig"
      - ".gitignore"
      - "compose.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3
        with:
          config: .hadolint.yaml

      - name: ShellCheck
        uses: docker://koalaman/shellcheck-alpine:stable
        with:
          args: entrypoint.sh

      - name: Check shell formatting
        uses: docker://mvdan/shfmt:v3
        with:
          args: -i 2 -d entrypoint.sh

      - name: Lint YAML
        uses: docker://cytopia/yamllint:latest
        with:
          args: compose.yml .github/workflows

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: stefanomuraro/openarena-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
