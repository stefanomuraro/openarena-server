// Game Rules
set g_gametype 0
set g_rockets 0
set timelimit 20
set capturelimit 8
set fraglimit 20
set disable_weapon_bfg "0"
set g_friendlyfire "0"
set g_teamAutoJoin "0"
set g_teamForceBalance "0"
set g_forcerespawn "0"
set g_quadfactor "3"
set g_weaponrespawn "5"

// Bots
set bot_enable "1"
set bot_minplayers "0"
set bot_nochat "1"

// Map cycle
set m1 "map aggressor ; set nextmap vstr m2"
set m2 "map am_lavaarena ; set nextmap vstr m3"
set m3 "map blitzkrieg3 ; set nextmap vstr m4"
set m4 "map ce1m7 ; set nextmap vstr m5"
set m5 "map czest1dm ; set nextmap vstr m6"
set m6 "map kaos2 ; set nextmap vstr m7"
set m7 "map oa_dm1 ; set nextmap vstr m8"
set m8 "map oa_dm2 ; set nextmap vstr m9"
set m9 "map oa_dm3 ; set nextmap vstr m10"
set m10 "map oa_dm4 ; set nextmap vstr m11"
set m11 "map oa_dm5 ; set nextmap vstr m12"
set m12 "map oa_dm7 ; set nextmap vstr m13"
set m13 "map oa_koth1 ; set nextmap vstr m14"
set m14 "map oa_koth2 ; set nextmap vstr m15"
set m15 "map oa_shine ; set nextmap vstr m1"

// Start map cycle
vstr m1
