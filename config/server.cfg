// Server Information
set sv_hostname "A ^5Super Cool^7 Server"
set g_motd "Have fun :)"

// Administration
set rconpassword "1234"

// Server Configuration
set sv_pure 1
set g_allowvote "1"
set sv_floodProtect "0"
set g_filterBan "1"
set sv_maxClients "16"
set sv_privateClients "2"
set sv_cheats "0"

// Logging
set g_logfile "server.log"
set g_logfileSync "1"
set g_log "server.log"
set g_logSync "1"

// Downloads
set sv_allowdownload "1"
set sv_wwwDownload "0"
set cl_wwwDownload "0"
set sv_dlURL ""

// Network
set sv_maxping "300"
set sv_minping 0
set sv_maxRate "25000"
set sv_snaps 40
set g_delaghitscan "1"

// Game Configuration
exec game.cfg
